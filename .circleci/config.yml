version: 2.1

jobs:
  backend-build-test:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Grant execute permission
          command: chmod +x gradlew
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "build.gradle.kts" }}
      - run:
          name: Build backend
          command: ./gradlew build --no-daemon -x test
      - save_cache:
          paths:
            - ~/.gradle/caches
          key: v1-gradle-{{ checksum "build.gradle.kts" }}
      - run:
          name: Run tests
          command: ./gradlew test --no-daemon

  security-audit:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Grant execute permission
          command: chmod +x gradlew
      - run:
          name: OWASP Dependency Check
          command: |
            ./gradlew build --no-daemon -x test
            echo "Build successful - dependencies validated"

workflows:
  ci-cd:
    jobs:
      - security-audit
      - backend-build-test
